name: Deploy to GitHub Pages
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site/ to master
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: master
          folder: site
