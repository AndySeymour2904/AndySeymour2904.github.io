<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07090d; color: #d6dde8; font: 400 17px/1.5 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .v { position: relative; min-height: 100svh; overflow: hidden; isolation: isolate; background: #07090d; }
  .v > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .tag { position: absolute; z-index: 50; top: 12px; left: 12px; font: 500 12px "Geist Mono", monospace; padding: 5px 9px; border-radius: 6px; background: #ffffffe6; color: #111; }
  .toc { position: fixed; z-index: 60; right: 10px; top: 50%; transform: translateY(-50%); display: grid; gap: 3px; }
  .toc a { font: 500 11px "Geist Mono", monospace; background: #ffffffd9; color: #111; padding: 3px 6px; border-radius: 5px; text-align: center; }
  @media (max-width: 700px) { .toc { display: none; } }

  .ring { width: var(--s, 120px); height: var(--s, 120px); border-radius: 50%; padding: 4px; background: conic-gradient(from 210deg, var(--r1, #7aa2ff), var(--r2, #a5f3fc), var(--r1, #7aa2ff)); flex: none; }
  .ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--rb, #07090d); display: block; }
  .term { font: 16px/1.8 "Geist Mono", monospace; min-height: 12.6em; }
  .term .p { color: var(--prompt, #7ee2a8) } .term .o { color: var(--out, #9aa6b8) } .term a { color: var(--link, #7aa2ff); }
  .term .cur { display: inline-block; width: .6em; height: 1.1em; background: currentColor; vertical-align: -.2em; animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
  .term input { all: unset; font: inherit; color: #fff; width: 70%; caret-color: var(--prompt, #7ee2a8); }
  .wrap { position: relative; z-index: 2; display: flex; gap: 34px; align-items: flex-start; width: min(860px, 100%); }
  .center { display: grid; place-items: center; padding: 60px 20px; }
  @media (max-width: 760px) { .wrap { flex-direction: column; gap: 22px; } .term { font-size: 13px; } }

  /* T1: original S9, wave low */
  #t1 { padding-bottom: 34vh; }
  /* T2: wave raised to fill the bottom half and rise behind the text */
  #t2 { align-content: start; padding-top: 16vh; }
  #t2::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(#07090d 0 30%, #07090d00 62%); pointer-events: none; }
  /* T3: every keystroke sends a ripple, output swells the surface */
  #t3 { align-content: start; padding-top: 14vh; }
  /* T4: the terminal is a window sitting on the surface */
  #t4 { align-content: center; padding-bottom: 8vh; }
  #t4 .win { position: relative; z-index: 2; width: min(760px, 100%); border-radius: 14px; background: #0b0f16d9; backdrop-filter: blur(10px); box-shadow: 0 0 0 1px #ffffff1a, 0 60px 120px -40px #000; overflow: hidden; }
  #t4 .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #ffffff14; font: 13px "Geist Mono"; color: #8a94a6; }
  #t4 .bar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; background: #2b3240; }
  #t4 .bar img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
  #t4 .term { padding: 20px 24px; }
  /* T5: simple, one oscilloscope line */
  #t5 .scope { position: relative; z-index: 2; width: min(860px, 100%); height: 90px; margin-top: 30px; }
  #t5 .scope canvas { width: 100%; height: 100%; display: block; }
  #t5 { align-content: center; }
  /* T6: simple, flat dot grid that wakes around the cursor */
  #t6 { align-content: center; }
  /* T7: ASCII portrait printed in the terminal */
  #t7 .ascii { font: 8px/8px "Geist Mono", monospace; color: #d3def2; white-space: pre; letter-spacing: 0; }
  #t7 .wrap { align-items: center; }
  #t7 { padding-bottom: 26vh; }
  @media (max-width: 760px) { #t7 .ascii { font-size: 5px; line-height: 5px; } }
  /* T8: interactive, type your own commands */
  #t8 { align-content: start; padding-top: 12vh; }
  #t8 .hint { color: #5d6778; font: 13px "Geist Mono"; margin-top: 10px; }
  /* T9: wave inside the terminal window */
  #t9 .win { position: relative; z-index: 2; width: min(820px, 100%); border-radius: 16px; background: #05070b; box-shadow: 0 0 0 1px #ffffff1a, 0 50px 100px -40px #000; overflow: hidden; }
  #t9 .win canvas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 62%; }
  #t9 .in { position: relative; display: flex; gap: 26px; padding: 28px 28px 220px; } #t9 .bar { height: 36px; border-bottom: 1px solid #ffffff12; display: flex; align-items: center; padding: 0 14px; gap: 6px; } #t9 .bar i { width: 12px; height: 12px; border-radius: 50%; background: #2b3240; }
  @media (max-width: 760px) { #t9 .in { flex-direction: column; padding-bottom: 210px; } #t9 .win canvas { height: 230px; } }
  /* T10: light */
  #t10 { background: #fbfbfd; color: #1d1d1f; --prompt: #0071e3; --out: #6e6e73; --link: #0071e3; padding-bottom: 30vh; }
  #t10 .term { color: #1d1d1f; }
  /* T11: minimal, big type, no wave, cursor dot trail */
  #t11 { background: #000; align-content: center; }
  #t11 .term { font-size: clamp(18px, 2vw, 26px); min-height: 11em; }
  #t11 .head { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; font: 600 20px "Inter Tight"; color: #fff; } #t11 .head span { display: block; font-weight: 400; font-size: 15px; color: #7d8696; }
  /* T12: wave seen from higher up, dense, behind everything */
  #t12 { align-content: start; padding-top: 12vh; }
  #t12::after { content: ""; position: absolute; inset: 0; z-index: 1; background: radial-gradient(60% 50% at 40% 30%, #07090de6, #07090d00 70%); pointer-events: none; }
  @media (max-width: 760px) { #t12::after { background: linear-gradient(#07090df0 0 55%, #07090d00 80%); } }
</style>
</head>
<body>
<nav class="toc" aria-label="Variants"></nav>

<section class="v center" id="t1" data-name="Original S9, wave low"><canvas></canvas>
  <div class="wrap"><div class="ring"><img src="../img/me.jpg" alt="Andy Seymour"></div><div class="term"></div></div></section>

<section class="v center" id="t2" data-name="Wave raised, rising behind the text"><canvas></canvas>
  <div class="wrap"><div class="ring"><img src="../img/me.jpg" alt="Andy Seymour"></div><div class="term"></div></div></section>

<section class="v center" id="t3" data-name="Typing drives the wave"><canvas></canvas>
  <div class="wrap"><div class="ring"><img src="../img/me.jpg" alt="Andy Seymour"></div><div class="term"></div></div></section>

<section class="v center" id="t4" data-name="Terminal window resting on the surface"><canvas></canvas>
  <div class="win"><div class="bar"><span><i></i><i></i><i></i></span><img src="../img/me.jpg" alt="">andy@london: ~</div><div class="term"></div></div></section>

<section class="v center" id="t5" data-name="Simple: one live line">
  <div class="wrap"><div class="ring"><img src="../img/me.jpg" alt="Andy Seymour"></div><div class="term"></div></div>
  <div class="scope"><canvas></canvas></div></section>

<section class="v center" id="t6" data-name="Simple: flat dot grid"><canvas></canvas>
  <div class="wrap"><div class="ring"><img src="../img/me.jpg" alt="Andy Seymour"></div><div class="term"></div></div></section>

<section class="v center" id="t7" data-name="ASCII portrait"><canvas></canvas>
  <div class="wrap"><pre class="ascii" aria-label="Andy Seymour"></pre><div class="term"></div></div></section>

<section class="v center" id="t8" data-name="Interactive: type commands"><canvas></canvas>
  <div class="wrap"><div class="ring"><img src="../img/me.jpg" alt="Andy Seymour"></div><div><div class="term"></div><p class="hint">Try: help, experience, projects, skills, contact</p></div></div></section>

<section class="v center" id="t9" data-name="Wave inside the window">
  <div class="win"><div class="bar"><i></i><i></i><i></i></div><canvas></canvas><div class="in"><div class="ring" style="--s:96px;--rb:#05070b"><img src="../img/me.jpg" alt="Andy Seymour"></div><div class="term"></div></div></div></section>

<section class="v center" id="t10" data-name="Light"><canvas></canvas>
  <div class="wrap"><div class="ring" style="--rb:#fbfbfd;--r1:#0071e3;--r2:#7dd3fc"><img src="../img/me.jpg" alt="Andy Seymour"></div><div class="term"></div></div></section>

<section class="v center" id="t11" data-name="Minimal: big type, no wave">
  <div class="wrap" style="display:block;width:min(900px,100%)"><div class="head"><div class="ring" style="--s:56px;--rb:#000"><img src="../img/me.jpg" alt="Andy Seymour"></div><div>Andy Seymour<span>Software engineer, London</span></div></div><div class="term"></div></div></section>

<section class="v center" id="t12" data-name="Wave from above, filling the page"><canvas></canvas>
  <div class="wrap"><div class="ring"><img src="../img/me.jpg" alt="Andy Seymour"></div><div class="term"></div></div></section>

<script src="wave2.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s)
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
document.querySelectorAll('.v').forEach((s, i) => {
  s.prepend(Object.assign(document.createElement('span'), { className: 'tag', textContent: `T${i + 1} ${s.dataset.name}` }))
  $('.toc').append(Object.assign(document.createElement('a'), { href: '#' + s.id, textContent: 'T' + (i + 1), title: s.dataset.name }))
})
const SESSION = [['whoami', 'Andy Seymour, software engineer in London'], ['cat now.txt', 'Trading strategies in C++ and Python at Gambit Research'], ['ls past/', 'ibm/  bae-systems/  msc-mathematics/'], ['contact', '<a href="mailto:aseymour917@gmail.com">aseymour917@gmail.com</a>']]

/* types the session once the terminal scrolls into view; hooks let the wave react */
function typer(term, { onKey, onLine, after, lines = SESSION, speed = 45 } = {}) {
  new IntersectionObserver(([e], o) => {
    if (!e.isIntersecting) return; o.disconnect(); let i = 0
    if (reduced) { lines.forEach(([c, out]) => term.insertAdjacentHTML('beforeend', `<div><span class="p">$</span> ${c}</div><div class="o">${out}</div>`)); return after ? after() : term.insertAdjacentHTML('beforeend', '<div><span class="p">$</span> <span class="cur"></span></div>') }
    const next = () => {
      if (i >= lines.length) return after ? after() : term.insertAdjacentHTML('beforeend', '<div><span class="p">$</span> <span class="cur"></span></div>')
      const [cmd, out] = lines[i++], row = document.createElement('div'); term.append(row); let k = 0
      const iv = setInterval(() => { row.innerHTML = '<span class="p">$</span> ' + cmd.slice(0, ++k) + '<span class="cur"></span>'; onKey?.(k, cmd); if (k >= cmd.length) { clearInterval(iv); setTimeout(() => { row.innerHTML = '<span class="p">$</span> ' + cmd; term.insertAdjacentHTML('beforeend', `<div class="o">${out}</div>`); onLine?.(i); setTimeout(next, 420) }, 220) } }, speed)
    }
    setTimeout(next, 400)
  }, { threshold: .4 }).observe(term)
}

// T1: as S9
Wave2($('#t1 canvas'), { dot: [214, 221, 232], glow: [126, 226, 168], line: '#7ee2a8', horizon: .74, spot: .7 })
typer($('#t1 .term'))

// T2: horizon higher, bigger swell, the surface rises behind the text and fades out at the top
Wave2($('#t2 canvas'), { dot: [214, 221, 232], glow: [126, 226, 168], line: '#7ee2a8', horizon: innerWidth < 760 ? .64 : .42, spot: .55, amp: 1.5, density: 1.5 })
typer($('#t2 .term'))

// T3: keystrokes ripple out from under the cursor line, each output line swells the whole surface
const w3 = Wave2($('#t3 canvas'), { dot: [214, 221, 232], glow: [126, 226, 168], line: '#7ee2a8', horizon: .56, spot: .6, amp: 1.2, density: 1.4 })
typer($('#t3 .term'), { onKey: k => w3.ripple(.38 + (k % 9) * .03, .12, .45), onLine: () => { w3.pulse(.9); w3.ripple(.5, .2, 1.4) } })

// T4: window resting on the surface
const w4 = Wave2($('#t4 canvas'), { dot: [214, 221, 232], glow: [122, 162, 255], line: '#7aa2ff', horizon: .6, spot: .8, amp: 1.25 })
typer($('#t4 .term'), { onLine: () => w4.ripple(.5, .08, 1) })

// T5: one line, like an oscilloscope trace, that jumps with each keystroke
;(() => {
  const cv = $('#t5 .scope canvas'), x = cv.getContext('2d'); let kick = 0, W, H
  const size = () => { const d = Math.min(devicePixelRatio, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0) }
  size(); new ResizeObserver(size).observe(cv)
  let mx = -1; cv.parentElement.parentElement.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); mx = (e.clientX - r.left) / r.width })
  const t0 = performance.now()
  ;(function f(now) { requestAnimationFrame(f); const t = reduced ? 0 : (now - t0) / 1000; kick *= .94; x.clearRect(0, 0, W, H)
    const n = Math.round(W / 3); x.beginPath()
    for (let i = 0; i <= n; i++) { const u = i / n, env = Math.sin(Math.PI * u), near = mx >= 0 ? Math.exp(-((u - mx) ** 2) / .004) : 0
      const y = H / 2 + env * (Math.sin(u * 18 - t * 2.2) * 6 + Math.sin(u * 47 + t * 3.1) * 2.5 * (1 + kick * 3) + near * Math.sin(u * 90 - t * 8) * 14)
      i ? x.lineTo(u * W, y) : x.moveTo(u * W, y) }
    const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#7ee2a800'); g.addColorStop(.5, '#7ee2a8'); g.addColorStop(1, '#7ee2a800'); x.strokeStyle = g; x.lineWidth = 1.5; x.stroke() })(t0)
  typer($('#t5 .term'), { onKey: () => kick = Math.min(1.5, kick + .35), onLine: () => kick = 2 })
})()

// T6: flat dot grid; dots near the cursor brighten and lift slightly
;(() => {
  const s = $('#t6'), cv = $('#t6 canvas'), x = cv.getContext('2d'); let W, H, mx = -1e4, my = -1e4
  const size = () => { const d = Math.min(devicePixelRatio, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0) }
  size(); new ResizeObserver(size).observe(cv)
  s.addEventListener('pointermove', e => { const r = s.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top }); s.addEventListener('pointerleave', () => mx = my = -1e4)
  ;(function f() { requestAnimationFrame(f); x.clearRect(0, 0, W, H); const g = 26
    for (let yy = g / 2; yy < H; yy += g) for (let xx = g / 2; xx < W; xx += g) { const d = Math.hypot(xx - mx, yy - my), k = Math.max(0, 1 - d / 180)
      x.fillStyle = k > 0 ? `rgba(126,226,168,${.12 + k * .8})` : 'rgba(214,221,232,.14)'; const r = 1.2 + k * 1.6; x.fillRect(xx - r / 2, yy - r / 2 - k * 4, r, r) } })()
  typer($('#t6 .term'))
})()

// T7: ASCII portrait typed into the terminal first
;(() => {
  const pre = $('#t7 .ascii'), img = new Image(); img.src = '../img/me.jpg'
  img.onload = () => { const cols = 64, rows = 40, c = document.createElement('canvas'); c.width = cols; c.height = rows; const g = c.getContext('2d'); g.drawImage(img, 60, 40, 680, 720, 0, 0, cols, rows)
    const d = g.getImageData(0, 0, cols, rows).data, ramp = ' .:-=+*#%@'; let out = ''
    for (let y = 0; y < rows; y++) { for (let xx = 0; xx < cols; xx++) { const k = (y * cols + xx) * 4, L = (d[k] * .3 + d[k + 1] * .59 + d[k + 2] * .11) / 255, vx = xx / cols - .5, vy = y / rows - .5, v = Math.max(0, 1 - Math.hypot(vx * 1.1, vy) * 1.9); out += ramp[Math.min(9, Math.floor(Math.min(1, L * 1.25) ** .9 * Math.min(1, v * 1.6) * 10))] } out += '\n' }
    pre.textContent = out }
  Wave2($('#t7 canvas'), { dot: [159, 180, 216], glow: [126, 226, 168], line: '#7ee2a8', horizon: .8, spot: .6, alpha: .8 })
  typer($('#t7 .term'))
})()

// T8: interactive after the intro
;(() => {
  const term = $('#t8 .term'), w = Wave2($('#t8 canvas'), { dot: [214, 221, 232], glow: [126, 226, 168], line: '#7ee2a8', horizon: innerWidth < 760 ? .7 : .55, spot: .6, amp: 1.2, density: 1.4 })
  const CMDS = { help: 'whoami  now  experience  projects  skills  contact  clear', whoami: 'Andy Seymour, software engineer in London', now: 'Trading strategies in C++ and Python at Gambit Research',
    experience: '2019 to now   Gambit Research   strategy development, tools, data team lead<br>2015 to 2019  IBM               MQ, App Connect, Cloud Integration Platform<br>2014 to 2015  BAE Systems       Typhoon and F-35 software',
    projects: '<a href="https://fploutlook.com">fploutlook.com</a>  <a href="https://whatslive.guide">whatslive.guide</a>  <a href="https://topiktrainer.com">topiktrainer.com</a>', skills: 'C++  Python  Spark  Kafka  SQL  React  TypeScript  AWS', contact: '<a href="mailto:aseymour917@gmail.com">aseymour917@gmail.com</a>' }
  typer(term, { lines: SESSION.slice(0, 2), onLine: () => w.ripple(.5, .15, 1), after: () => {
    const row = document.createElement('div'), inp = Object.assign(document.createElement('input'), { 'aria-label': 'Type a command', spellcheck: false, autocomplete: 'off' })
    row.innerHTML = '<span class="p">$</span> '; row.append(inp); term.append(row); inp.focus({ preventScroll: true })
    inp.addEventListener('keydown', e => { w.ripple(.42 + Math.random() * .16, .1, .35); if (e.key !== 'Enter') return
      const v = inp.value.trim().toLowerCase(); inp.value = ''
      if (v === 'clear') { term.querySelectorAll(':scope > div:not(:last-child)').forEach(n => n.remove()); return }
      row.insertAdjacentHTML('beforebegin', `<div><span class="p">$</span> ${v.replace(/</g, '&lt;')}</div><div class="o" style="white-space:pre-wrap">${CMDS[v] ?? `command not found: ${v.replace(/</g, '&lt;')}. Try help.`}</div>`)
      w.pulse(.8); w.ripple(.5, .15, 1.3) })
    $('#t8').addEventListener('click', e => { if (!e.target.closest('a')) inp.focus({ preventScroll: true }) })
  } })
})()

// T9: wave inside the window, reacting to output
const w9 = Wave2($('#t9 canvas'), { host: $('#t9 .win'), dot: [214, 221, 232], glow: [126, 226, 168], line: '#7ee2a8', horizon: .15, spot: .7, density: .85 })
typer($('#t9 .term'), { onLine: () => w9.ripple(.5, .1, 1.1) })

// T10: light
Wave2($('#t10 canvas'), { dot: [29, 29, 31], glow: [0, 113, 227], line: '#0071e3', horizon: .7, spot: .6, alpha: .75 })
typer($('#t10 .term'))

// T11: no wave at all
typer($('#t11 .term'), { speed: 55 })

// T12: camera higher, the surface fills the page
const w12 = Wave2($('#t12 canvas'), { dot: [214, 221, 232], glow: [126, 226, 168], line: '#7ee2a8', horizon: .12, camY: -3.2, spot: .4, amp: 1.4, density: 1.6 })
typer($('#t12 .term'), { onLine: () => w12.pulse(.5) })
</script>
</body>
</html>
