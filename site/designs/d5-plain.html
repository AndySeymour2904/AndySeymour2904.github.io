<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plain · Andy Seymour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fbfbf9; --fg:#1d1d1b; --mute:#7d7c77; --line:#e6e5e0; --link:#1546c0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111211; --fg:#e4e3dd; --mute:#8a8983; --line:#262725; --link:#8db0ff; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 400 15px/1.7 "IBM Plex Mono", ui-monospace, monospace; }
  main { max-width: 72ch; margin: 0 auto; padding: clamp(40px, 10vh, 110px) 16px 80px; }
  a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { background: var(--link); color: var(--bg); text-decoration: none; }
  h1 { font-size: 15px; font-weight: 600; }
  .sub { color: var(--mute); }
  p { margin-top: 1.1em; }
  h2 { font-size: 15px; font-weight: 600; margin: 3.2em 0 1em; display: flex; gap: 1ch; align-items: center; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .job { margin-bottom: 2em; }
  .job-h { display: flex; justify-content: space-between; gap: 2ch; flex-wrap: wrap; }
  .job-h b { font-weight: 600; } .job-h span { color: var(--mute); }
  .role { margin: .9em 0 0 2ch; position: relative; }
  .role::before { content: "–"; position: absolute; left: -2ch; color: var(--mute); }
  .role i { color: var(--mute); font-style: normal; }
  .role p { margin-top: .2em; }
  dl div { display: grid; grid-template-columns: 16ch 1fr; gap: 2ch; } dt { color: var(--mute); }
  @media (max-width: 520px) { dl div { grid-template-columns: 1fr; gap: 0; margin-bottom: .6em; } }
  ul { list-style: none; } li { margin-bottom: .6em; }
  .cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--fg); vertical-align: -2px; animation: b 1.1s steps(1) infinite; margin-left: 2px; }
  @keyframes b { 50% { opacity: 0 } }
  footer { margin-top: 4em; color: var(--mute); }
</style>
</head>
<body>
<main id="app"></main>
<script src="content.js"></script>
<script>
const C = CV, app = document.getElementById('app')
app.append(
  h('h1', {}, C.name, h('span', { class: 'cursor', 'aria-hidden': 'true' })),
  h('p', { class: 'sub', style: 'margin-top:0' }, `${C.title}, ${C.location}`),
  h('p', {}, C.summary),
  h('p', {}, h('a', { href: 'mailto:' + C.email }, C.email), ' · ', ...C.links.flatMap((l, i) => [i ? ' · ' : '', h('a', { href: l.url }, l.label)])),
  h('h2', {}, 'Experience'),
  ...C.jobs.map(j => h('div', { class: 'job' }, h('div', { class: 'job-h' }, h('b', {}, j.company), h('span', {}, `${years(j)}, ${j.place}`)),
    j.roles.map(r => h('div', { class: 'role' }, r.title, r.tags.length ? h('i', {}, '  [' + r.tags.join(', ') + ']') : null, h('p', {}, r.text))))),
  h('h2', {}, 'Skills'),
  h('dl', {}, C.skills.map(s => h('div', {}, h('dt', {}, s.group), h('dd', {}, s.items)))),
  h('h2', {}, 'Side projects'),
  h('ul', {}, C.projects.map(p => h('li', {}, h('a', { href: p.url }, p.name), ' — ', p.text))),
  h('h2', {}, 'Education'),
  h('p', { style: 'margin-top:0' }, `${C.education.degree}, ${C.education.school}. ${C.education.note}.`),
  h('footer', {}, `© 2026 ${C.name}. No trackers, no framework.`))
</script>
</body>
</html>
