<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar · Andy Seymour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#151614; --bg2:#1c1d1b; --fg:#ecece6; --fg2:#a6a69e; --mute:#6f6f68; --line:#2a2b28; --acc:#c8f06a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg2); font: 400 16px/1.65 Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(520px circle at var(--mx, 30%) var(--my, 20%), #c8f06a0d, transparent 70%); }
  a { color: inherit; text-decoration: none; }
  .shell { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 64px; }
  @media (min-width: 1000px) { .shell { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } .side { position: sticky; top: 0; height: 100vh; } }
  .side { display: flex; flex-direction: column; padding: clamp(48px, 10vh, 100px) 0 48px; }
  .side h1 { color: var(--fg); font-size: clamp(40px, 4.6vw, 60px); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .side .role { color: var(--fg); font-size: 20px; font-weight: 600; margin-top: 12px; }
  .side .short { margin-top: 16px; max-width: 24em; }
  .toc { list-style: none; margin-top: 56px; display: none; }
  @media (min-width: 1000px) { .toc { display: block; } }
  .toc a { display: flex; align-items: center; gap: 14px; padding: 9px 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); transition: color .2s; }
  .toc a::before { content: ""; width: 32px; height: 1px; background: currentColor; transition: width .3s; }
  .toc a:hover, .toc a.on { color: var(--fg); } .toc a:hover::before, .toc a.on::before { width: 64px; background: var(--acc); }
  .soc { display: flex; gap: 20px; margin-top: auto; padding-top: 40px; font-size: 14px; } .soc a:hover { color: var(--acc); }
  main { padding: clamp(24px, 10vh, 100px) 0 80px; }
  section { margin-bottom: 96px; scroll-margin-top: 80px; }
  h2 { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--fg); margin-bottom: 24px; }
  @media (min-width: 1000px) { h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
  .about p { font-size: 18px; } .about b { color: var(--fg); font-weight: 600; }
  .card { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 24px; padding: 22px; margin: 0 -22px 8px; border-radius: 10px; border: 1px solid transparent; transition: background .25s, border-color .25s; }
  .card:hover { background: var(--bg2); border-color: var(--line); }
  .when { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); padding-top: 4px; }
  .card h3 { color: var(--fg); font-size: 17px; font-weight: 600; line-height: 1.35; }
  .card h3 span { color: var(--acc); }
  .card p { font-size: 15px; margin-top: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; list-style: none; }
  .tags li { font-size: 12px; font-weight: 600; color: var(--acc); background: #c8f06a14; border-radius: 99px; padding: 3px 11px; }
  .sub { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); } .sub b { color: var(--fg); font-weight: 600; font-size: 15px; } .sub p { margin-top: 2px; }
  .card img { width: 100%; border-radius: 6px; border: 1px solid var(--line); aspect-ratio: 16/10; object-fit: cover; object-position: top left; margin-top: 4px; }
  @media (max-width: 600px) { .card { grid-template-columns: 1fr; margin: 0 0 8px; padding: 16px 0; } .card:hover { background: none; border-color: transparent; } }
  .mail { color: var(--fg); font-size: clamp(22px, 3vw, 32px); font-weight: 700; letter-spacing: -.02em; border-bottom: 2px solid var(--acc); overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script src="content.js"></script>
<script>
const C = CV, app = document.getElementById('app')
const secs = [['about', 'About'], ['experience', 'Experience'], ['projects', 'Projects'], ['contact', 'Contact']]
app.append(
  h('header', { class: 'side' }, h('h1', {}, C.name), h('p', { class: 'role' }, C.title), h('p', { class: 'short' }, C.short),
    h('ul', { class: 'toc' }, secs.map(([id, l]) => h('li', {}, h('a', { href: '#' + id }, l)))),
    h('div', { class: 'soc' }, C.links.map(l => h('a', { href: l.url }, l.label)))),
  h('main', {},
    h('section', { id: 'about', class: 'about' }, h('h2', {}, 'About'), h('p', {}, C.summary),
      h('p', { style: 'margin-top:16px' }, 'Education: ', h('b', {}, C.education.degree), `, ${C.education.school}.`)),
    h('section', { id: 'experience' }, h('h2', {}, 'Experience'),
      C.jobs.map(j => h('div', { class: 'card' }, h('p', { class: 'when' }, years(j)),
        h('div', {}, h('h3', {}, j.roles[0].title, ' · ', h('span', {}, j.company)), h('p', {}, j.roles[0].text),
          j.roles.slice(1).map(r => h('div', { class: 'sub' }, h('b', {}, r.title), h('p', {}, r.text))),
          h('ul', { class: 'tags' }, [...new Set(j.roles.flatMap(r => r.tags))].map(t => h('li', {}, t))))))),
    h('section', { id: 'projects' }, h('h2', {}, 'Projects'),
      C.projects.map(p => h('a', { class: 'card', href: p.url, target: '_blank' }, h('img', { src: p.img, alt: '', loading: 'lazy' }), h('div', {}, h('h3', {}, p.name, ' ↗'), h('p', {}, p.text))))),
    h('section', { id: 'contact' }, h('h2', {}, 'Contact'), h('p', { style: 'margin-bottom:14px' }, 'The quickest way to reach me is email.'), h('a', { class: 'mail', href: 'mailto:' + C.email }, C.email))))
addEventListener('pointermove', e => { document.body.style.setProperty('--mx', e.clientX + 'px'); document.body.style.setProperty('--my', e.clientY + 'px') })
const links = document.querySelectorAll('.toc a')
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.hash === '#' + e.target.id)) }), { rootMargin: '-40% 0px -55% 0px' })
document.querySelectorAll('main section').forEach(s => io.observe(s))
</script>
</body>
</html>
