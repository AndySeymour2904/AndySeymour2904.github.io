<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic · Andy Seymour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ecebe5; --fg:#121211; --fg2:#4a4a46; --mute:#8b8a84; --line:#cfcdc4; --acc:#1f45ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; }
  body { background: var(--bg); color: var(--fg); font: 400 17px/1.55 "Bricolage Grotesque", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: inherit; text-decoration: none; }
  .pad { padding: 0 clamp(16px, 3vw, 40px); }
  .nav { position: fixed; inset: 0 0 auto; z-index: 5; display: flex; justify-content: space-between; padding-top: 18px; font-size: 14px; mix-blend-mode: difference; color: #fff; }
  .nav nav { display: flex; gap: 20px; }
  .hero { height: 100svh; min-height: 520px; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 4vh; position: relative; }
  .hero h1 { font-size: clamp(60px, 17.5vw, 300px); font-weight: 800; letter-spacing: -.06em; line-height: .78; font-variation-settings: "opsz" 96; white-space: nowrap; will-change: transform; }
  .hero h1 .s2 { display: block; padding-left: 8vw; }
  .hero .meta { position: absolute; top: 26vh; right: clamp(16px, 3vw, 40px); text-align: right; font-size: clamp(16px, 1.6vw, 22px); line-height: 1.3; }
  .hero .meta b { font-weight: 600; } .hero .meta span { color: var(--fg2); }
  .band { border-top: 1px solid var(--fg); border-bottom: 1px solid var(--fg); padding: 14px 0; overflow: hidden; background: var(--fg); color: var(--bg); }
  .band div { display: flex; gap: 48px; white-space: nowrap; font-size: clamp(28px, 4vw, 56px); font-weight: 300; letter-spacing: -.03em; will-change: transform; }
  .band i { font-style: normal; color: var(--acc); filter: brightness(1.6); }
  .intro { padding-top: clamp(80px, 12vw, 160px); padding-bottom: clamp(60px, 9vw, 120px); }
  .intro p { font-size: clamp(26px, 3.6vw, 52px); line-height: 1.12; letter-spacing: -.03em; font-weight: 400; max-width: 20em; }
  .intro p .w { opacity: .14; transition: opacity .3s; }
  .intro p .w.on { opacity: 1; }
  .chap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 40px; border-top: 1px solid var(--fg); padding-top: 18px; padding-bottom: clamp(60px, 9vw, 110px); }
  @media (min-width: 900px) { .chap { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } .chap > h2 { position: sticky; top: 70px; align-self: start; } }
  .chap > h2 { font-size: clamp(40px, 7vw, 110px); font-weight: 700; letter-spacing: -.055em; line-height: .9; margin-bottom: 20px; }
  .co + .co { margin-top: 48px; }
  .co h3 { font-size: clamp(26px, 2.8vw, 38px); font-weight: 600; letter-spacing: -.035em; line-height: 1; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .co h3 small { font-size: 14px; color: var(--mute); font-weight: 400; letter-spacing: 0; }
  .r { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .r b { font-weight: 600; font-size: 18px; } .r .t { color: var(--acc); font-size: 13px; } .r p { color: var(--fg2); max-width: 60ch; }
  .sk { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
  .sk b { display: block; font-size: 13px; color: var(--mute); font-weight: 500; }
  .pj a { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 20px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .pj b { font-size: clamp(24px, 3vw, 40px); font-weight: 600; letter-spacing: -.04em; line-height: 1; transition: color .2s; } .pj p { color: var(--fg2); }
  .pj img { width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top left; border-radius: 4px; transform: scale(.9) rotate(-2deg); opacity: .5; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; }
  .pj a:hover img { transform: none; opacity: 1; } .pj a:hover b { color: var(--acc); }
  @media (max-width: 560px) { .pj a { grid-template-columns: 1fr; } .pj img { display: none; } }
  .end { background: var(--fg); color: var(--bg); padding-top: clamp(80px, 12vw, 160px); padding-bottom: 28px; }
  .end a.mail { display: block; font-size: clamp(34px, 8vw, 130px); font-weight: 700; letter-spacing: -.06em; line-height: .95; overflow-wrap: anywhere; }
  .end a.mail:hover { color: #7d93ff; }
  .end ul { list-style: none; display: flex; gap: 24px; margin-top: 40px; padding-top: 14px; border-top: 1px solid #ffffff33; }
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script>
const C = CV, app = document.getElementById('app')
const words = C.summary.split(' ').map(w => h('span', { class: 'w' }, w + ' '))
const bandItems = ['Strategy development', 'C++', 'Python', 'Trading', 'Data platforms', 'Gambit Research', 'IBM', 'BAE Systems', 'London']
const bandRow = h('div', {}, [...bandItems, ...bandItems, ...bandItems].map((t, i) => [h('span', {}, t), h('i', {}, '/')]))
const h1 = h('h1', {}, 'Andy', h('span', { class: 's2' }, 'Seymour'))
app.append(
  h('header', { class: 'nav pad' }, h('span', {}, C.name), h('nav', {}, h('a', { href: '#work' }, 'Work'), h('a', { href: '#contact' }, 'Contact'))),
  h('div', { class: 'hero pad' }, h('p', { class: 'meta' }, h('b', {}, C.title), h('br'), h('span', {}, C.location)), h1),
  h('div', { class: 'band', 'aria-hidden': 'true' }, bandRow),
  h('div', { class: 'intro pad' }, h('p', {}, words)),
  h('section', { class: 'chap pad', id: 'work' }, h('h2', {}, 'Experience'), h('div', {}, C.jobs.map(j => h('div', { class: 'co' }, h('h3', {}, j.company, h('small', {}, `${years(j)} · ${j.place}`)),
    j.roles.map(r => h('div', { class: 'r' }, h('b', {}, r.title), r.tags.length ? h('div', { class: 't' }, r.tags.join(' / ')) : null, h('p', {}, r.text))))))),
  h('section', { class: 'chap pad' }, h('h2', {}, 'Skills'), h('div', { class: 'sk' }, C.skills.map(s => h('div', {}, h('b', {}, s.group), s.items)))),
  h('section', { class: 'chap pad' }, h('h2', {}, 'Projects'), h('div', { class: 'pj' }, C.projects.map(p => h('a', { href: p.url, target: '_blank' }, h('div', {}, h('b', {}, p.name), h('p', {}, p.text)), h('img', { src: p.img, alt: '', loading: 'lazy' }))))),
  h('section', { class: 'chap pad' }, h('h2', {}, 'Education'), h('p', { style: 'font-size:22px;letter-spacing:-.02em' }, `${C.education.degree}, ${C.education.school}. ${C.education.note}.`)),
  h('footer', { class: 'end pad', id: 'contact' }, h('a', { class: 'mail', href: 'mailto:' + C.email }, C.email), h('ul', {}, C.links.map(l => h('li', {}, h('a', { href: l.url }, l.label + ' ↗'))))))
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
const onScroll = () => {
  const y = scrollY
  if (!reduced) {
    h1.style.transform = `translateX(${-y * .25}px)`
    bandRow.style.transform = `translateX(${-(y * .6) % (bandRow.scrollWidth / 3)}px)`
  }
  const intro = document.querySelector('.intro').getBoundingClientRect()
  const p = Math.min(1, Math.max(0, (innerHeight * .85 - intro.top) / (intro.height + innerHeight * .2)))
  const n = reduced ? words.length : Math.round(p * words.length)
  words.forEach((w, i) => w.classList.toggle('on', i < n))
}
addEventListener('scroll', onScroll, { passive: true }); onScroll()
</script>
</body>
</html>
