<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave · Andy Seymour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#050607; --fg:#eef0f2; --fg2:#a3a8ad; --mute:#666c72; --line:#1a1d21; --acc:#7cc4ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 300 17px/1.65 "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }
  .nav { position: absolute; inset: 0 0 auto; z-index: 3; display: flex; justify-content: space-between; padding: 22px clamp(16px, 4vw, 48px); font-size: 14px; font-weight: 400; color: var(--fg2); }
  .nav nav { display: flex; gap: 24px; } .nav a:hover { color: var(--fg); }
  .hero { position: relative; height: 100svh; min-height: 540px; display: grid; place-items: center; text-align: center; overflow: hidden; }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, #050607 0%, #05060700 55%); pointer-events: none; }
  .hero-t { position: relative; z-index: 2; padding: 0 16px; pointer-events: none; }
  .hero h1 { font-size: clamp(48px, 9vw, 140px); font-weight: 200; letter-spacing: -.04em; line-height: .95; }
  .hero p { margin-top: 18px; font-size: clamp(15px, 1.4vw, 19px); color: var(--fg2); font-weight: 400; letter-spacing: .02em; }
  .hero p b { color: var(--fg); font-weight: 500; }
  .scroll { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 2; width: 1px; height: 46px; background: linear-gradient(var(--fg2), transparent); animation: s 2.2s infinite; }
  @keyframes s { 0% { transform: translateX(-50%) scaleY(0); transform-origin: top } 50% { transform: translateX(-50%) scaleY(1); transform-origin: top } 51% { transform-origin: bottom } 100% { transform: translateX(-50%) scaleY(0); transform-origin: bottom } }
  .lead { padding: clamp(80px, 12vw, 160px) 0 40px; font-size: clamp(22px, 2.6vw, 34px); line-height: 1.35; font-weight: 300; letter-spacing: -.01em; max-width: 30em; }
  section { padding-top: clamp(64px, 9vw, 120px); }
  h2 { font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--acc); margin-bottom: 24px; }
  .job { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 6px 40px; padding: 30px 0; border-top: 1px solid var(--line); }
  .job h3 { font-size: 26px; font-weight: 400; letter-spacing: -.02em; } .job .w { font-size: 13px; color: var(--mute); font-weight: 400; }
  .role + .role { margin-top: 18px; } .role b { font-weight: 500; font-size: 18px; } .role .t { font-size: 13px; color: var(--acc); font-weight: 400; } .role p { color: var(--fg2); max-width: 62ch; }
  .sk { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 28px; } .sk b { display: block; font-size: 13px; color: var(--mute); font-weight: 400; } .sk div { font-weight: 400; }
  .pj { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
  .pj a { display: block; border-radius: 14px; overflow: hidden; background: #0c0e10; border: 1px solid var(--line); transition: border-color .3s, transform .4s; }
  .pj a:hover { border-color: #2c3238; transform: translateY(-4px); }
  .pj img { width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top left; display: block; opacity: .8; }
  .pj div { padding: 16px 18px 18px; } .pj b { font-weight: 500; } .pj p { color: var(--fg2); font-size: 15px; font-weight: 400; }
  .contact { text-align: center; padding: clamp(100px, 14vw, 200px) 0 48px; }
  .contact a.mail { font-size: clamp(28px, 5.4vw, 76px); font-weight: 200; letter-spacing: -.035em; overflow-wrap: anywhere; } .contact a.mail:hover { color: var(--acc); }
  .contact ul { list-style: none; display: flex; justify-content: center; gap: 26px; margin-top: 22px; color: var(--fg2); font-weight: 400; }
  @media (max-width: 760px) { .job { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script>
const C = CV, app = document.getElementById('app')
const cv = h('canvas', { id: 'wave', 'aria-hidden': 'true' })
app.append(
  h('header', { class: 'nav' }, h('span', {}, C.name), h('nav', {}, h('a', { href: '#experience' }, 'Experience'), h('a', { href: '#contact' }, 'Contact'))),
  h('div', { class: 'hero' }, cv, h('div', { class: 'hero-t' }, h('h1', {}, C.name), h('p', {}, h('b', {}, C.title), ` · ${C.location}`)), h('div', { class: 'scroll' })),
  h('div', { class: 'wrap' },
    h('p', { class: 'lead' }, C.summary),
    h('section', { id: 'experience' }, h('h2', {}, 'Experience'), C.jobs.map(j => h('article', { class: 'job' }, h('div', {}, h('h3', {}, j.company), h('p', { class: 'w' }, `${years(j)} · ${j.place}`)),
      h('div', {}, j.roles.map(r => h('div', { class: 'role' }, h('b', {}, r.title), r.tags.length ? h('div', { class: 't' }, r.tags.join(' · ')) : null, h('p', {}, r.text))))))),
    h('section', {}, h('h2', {}, 'Skills'), h('div', { class: 'sk' }, C.skills.map(s => h('div', {}, h('b', {}, s.group), s.items)))),
    h('section', {}, h('h2', {}, 'Side projects'), h('div', { class: 'pj' }, C.projects.map(p => h('a', { href: p.url, target: '_blank' }, h('img', { src: p.img, alt: '', loading: 'lazy' }), h('div', {}, h('b', {}, p.name + ' ↗'), h('p', {}, p.text)))))),
    h('section', {}, h('h2', {}, 'Education'), h('p', { style: 'font-weight:400' }, `${C.education.degree} · ${C.education.school} · ${C.education.note}`)),
    h('footer', { class: 'contact', id: 'contact' }, h('a', { class: 'mail', href: 'mailto:' + C.email }, C.email), h('ul', {}, C.links.map(l => h('li', {}, h('a', { href: l.url }, l.label)))))))

// ---- perspective point-grid wave ----
const x = cv.getContext('2d')
let W, H, dpr
const size = () => { dpr = Math.min(devicePixelRatio, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0) }
size(); addEventListener('resize', size)
let mx = 0, my = 0, tmx = 0, tmy = 0
addEventListener('pointermove', e => { tmx = e.clientX / innerWidth - .5; tmy = e.clientY / innerHeight - .5 })
let vis = true; new IntersectionObserver(e => vis = e[0].isIntersecting).observe(cv)
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
const COLS = 90, ROWS = 46
const t0 = performance.now()
;(function frame(now) {
  requestAnimationFrame(frame)
  if (!vis) return
  const t = reduced ? 0 : (now - t0) / 1000
  mx += (tmx - mx) * .04; my += (tmy - my) * .04
  x.clearRect(0, 0, W, H)
  const fov = Math.min(W, H) * 1.1, camY = -1.2 + my * .6, rot = mx * .35
  const cr = Math.cos(rot), sr = Math.sin(rot)
  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const gx = (i / (COLS - 1) - .5) * 16, gz = j / (ROWS - 1) * 14 + 2
      const gy = Math.sin(gx * .55 + t * .9) * .35 + Math.cos(gz * .5 - t * .7) * .35 + Math.sin((gx + gz) * .3 + t * .4) * .25
      const rx = gx * cr - (gz - 8) * sr, rz = gx * sr + (gz - 8) * cr + 8
      const px = W / 2 + rx / rz * fov, py = H * .5 + (gy - camY) / rz * fov
      if (px < -10 || px > W + 10 || py < -10 || py > H + 10) continue
      const depth = 1 - rz / 18
      const lit = Math.max(0, gy + .6) / 1.6
      x.globalAlpha = Math.min(1, Math.max(0, depth) * (.45 + lit * 1.1))
      x.fillStyle = lit > .78 ? '#7cc4ff' : '#eef0f2'
      const r = Math.max(.7, 2.4 * depth)
      x.fillRect(px - r / 2, py - r / 2, r, r)
    }
  }
  x.globalAlpha = 1
})(t0)
</script>
</body>
</html>
