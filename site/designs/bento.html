<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andy Seymour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #e9ebef; --tile: #ffffff; --ink: #121417; --grey: #6b7079; --line: #e4e6ea; --blue: #2b59ff; --dark: #15171b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 Onest, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .grid { max-width: 1240px; margin: 0 auto; padding: clamp(12px, 3vw, 40px); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 88px; gap: 14px; }
  .t { background: var(--tile); border-radius: 26px; padding: 26px; position: relative; overflow: hidden; transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s; box-shadow: 0 1px 0 #0000000a; opacity: 0; transform: translateY(14px) scale(.985); }
  .t.in { opacity: 1; transform: none; transition: opacity .6s, transform .6s cubic-bezier(.2, .8, .2, 1); }
  a.t:hover, .t.hov:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -22px #0004; }
  .lbl { font-size: 13px; color: var(--grey); font-weight: 500; }
  /* intro */
  .intro { grid-column: span 7; grid-row: span 4; display: flex; flex-direction: column; }
  .intro .av { width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(140deg, #2b59ff, #6e8bff); color: #fff; display: grid; place-items: center; font: 800 26px Onest; letter-spacing: -.04em; }
  .intro h1 { font-size: clamp(40px, 5.2vw, 68px); font-weight: 800; letter-spacing: -.05em; line-height: .98; margin-top: auto; }
  .intro p { font-size: clamp(16px, 1.4vw, 19px); color: #3b3f47; margin-top: 14px; max-width: 34em; }
  .btns { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .b { padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; background: #f0f1f4; transition: background .2s; } .b:hover { background: #e4e6eb; }
  .b.pri { background: var(--ink); color: #fff; } .b.pri:hover { background: #000; }
  /* now */
  .now { grid-column: span 5; grid-row: span 2; background: var(--dark); color: #fff; }
  .now .lbl { color: #9aa0aa; display: flex; align-items: center; gap: 8px; } .now .lbl i { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 0 #3ddc84aa; animation: p 2s infinite; }
  @keyframes p { 70% { box-shadow: 0 0 0 9px #3ddc8400 } 100% { box-shadow: 0 0 0 0 #3ddc8400 } }
  .now h2 { font-size: 26px; letter-spacing: -.03em; line-height: 1.15; margin-top: 10px; font-weight: 700; } .now p { color: #b6bbc4; margin-top: 4px; }
  .now .langs { position: absolute; right: 22px; bottom: 20px; display: flex; gap: 6px; } .now .langs span { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: #ffffff14; }
  /* clock */
  .clock { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; }
  .clock .time { font-size: 34px; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .face { position: absolute; right: -26px; top: -26px; width: 110px; height: 110px; border-radius: 50%; border: 1px solid var(--line); }
  .face i { position: absolute; left: 50%; top: 50%; width: 2px; background: var(--ink); transform-origin: 50% 0; border-radius: 2px; }
  /* stack */
  .stack { grid-column: span 3; grid-row: span 2; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; } .chips span { font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 99px; background: #f0f1f4; }
  .chips span.k { background: #2b59ff14; color: var(--blue); }
  /* career */
  .career { grid-column: span 7; grid-row: span 4; }
  .tl { margin-top: 26px; display: grid; gap: 20px; }
  .tl .row { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; font-size: 14px; }
  .tl .row b { font-weight: 600; } .tl .row small { color: var(--grey); display: block; font-size: 12px; }
  .tl .bar { position: relative; height: 26px; border-radius: 8px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / 16)); }
  .tl .bar i { position: absolute; top: 0; bottom: 0; left: var(--a); width: var(--w); border-radius: 8px; background: var(--c); transform-origin: left; transform: scaleX(0); transition: transform 1s cubic-bezier(.2, .8, .2, 1); }
  .career.in .tl .bar i { transform: scaleX(1); }
  .tl .bar i span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tl .axis { display: flex; justify-content: space-between; margin-left: 164px; font-size: 11px; color: var(--grey); font-variant-numeric: tabular-nums; }
  /* gambit detail */
  .gambit { grid-column: span 5; grid-row: span 4; background: linear-gradient(160deg, #2b59ff, #1838c8); color: #fff; }
  .gambit .lbl { color: #ffffffb0; } .gambit h2 { font-size: 24px; letter-spacing: -.02em; margin-top: 6px; }
  .steps { list-style: none; margin-top: 16px; display: grid; gap: 10px; }
  .steps li { padding: 12px 14px; border-radius: 14px; background: #ffffff17; } .steps li.cur { background: #fff; color: var(--ink); }
  .steps b { display: block; font-size: 15px; } .steps span { font-size: 13px; opacity: .8; }
  /* projects */
  .proj { grid-column: span 4; grid-row: span 4; padding: 0; display: flex; flex-direction: column; }
  .proj .img { flex: 1; overflow: hidden; margin: 10px 10px 0; border-radius: 18px; background: #f0f1f4; }
  .proj img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
  .proj:hover img { transform: scale(1.04); }
  .proj .cap { padding: 16px 20px 20px; display: flex; justify-content: space-between; gap: 12px; align-items: end; }
  .proj b { font-size: 18px; letter-spacing: -.02em; display: block; } .proj .cap span { color: var(--grey); font-size: 13px; }
  .proj .go { width: 38px; height: 38px; flex: none; border-radius: 50%; background: #f0f1f4; display: grid; place-items: center; transition: background .2s, transform .3s; font-size: 16px; } .proj:hover .go { background: var(--ink); color: #fff; transform: rotate(-45deg); }
  /* misc */
  .edu { grid-column: span 4; grid-row: span 2; } .edu h3 { font-size: 20px; letter-spacing: -.02em; margin-top: 8px; } .edu p { color: var(--grey); }
  .bike { grid-column: span 4; grid-row: span 2; } .bike svg { position: absolute; right: 16px; bottom: 12px; width: 150px; height: 110px; } .bike h3 { font-size: 20px; letter-spacing: -.02em; margin-top: 8px; max-width: 9em; }
  .bike path { fill: none; stroke: var(--blue); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; transition: stroke-dashoffset 2s ease; } .bike.in path { stroke-dashoffset: 0; }
  .mail { grid-column: span 4; grid-row: span 2; background: var(--dark); color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
  .mail .lbl { color: #9aa0aa; } .mail b { font-size: clamp(18px, 1.7vw, 22px); letter-spacing: -.02em; overflow-wrap: anywhere; }
  .mail .copy { position: absolute; right: 20px; top: 20px; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 99px; background: #ffffff1a; border: 0; color: #fff; cursor: pointer; }
  .socials { grid-column: span 12; grid-row: span 1; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; }
  .socials div { display: flex; gap: 20px; font-weight: 500; } .socials a:hover { color: var(--blue); }
  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: auto; }
    .t { grid-column: span 6 !important; grid-row: auto !important; min-height: 160px; }
    .clock, .stack { grid-column: span 3 !important; } .proj { min-height: 380px; } .proj .img { height: 240px; flex: none; }
    .tl .row { grid-template-columns: 110px 1fr; } .tl .axis { margin-left: 124px; }
  }
  @media (max-width: 560px) { .clock, .stack { grid-column: span 6 !important; } .now .langs { position: static; margin-top: 14px; } }
  @media (prefers-reduced-motion: reduce) { .t, .t.in { opacity: 1; transform: none; transition: none; } .tl .bar i { transform: none; } }
</style>
</head>
<body>
<main class="grid" id="g"></main>
<script src="content.js"></script>
<script>
const C = CV, g = document.getElementById('g'), A0 = 2010, A1 = 2026.9, pct = y => ((y - A0) / (A1 - A0) * 100).toFixed(2) + '%'
const tl = [{ n: 'Gambit Research', s: 'Data, tools, strategies', a: 2019, b: A1, c: '#2b59ff' }, { n: 'IBM', s: 'MQ to cloud', a: 2015, b: 2019, c: '#5b6cff' }, { n: 'BAE Systems', s: 'Typhoon, F-35', a: 2014, b: 2015, c: '#8d9aff' }, { n: 'Leicester', s: 'MSc', a: 2010, b: 2014, c: '#c3caff' }]
const face = h('div', { class: 'face' }, h('i', { id: 'hh', style: 'height:28px' }), h('i', { id: 'mm', style: 'height:42px;opacity:.6' }))
const time = h('div', { class: 'time' })
g.append(
  h('section', { class: 't intro' }, h('div', { class: 'av' }, 'AS'), h('h1', {}, C.name), h('p', {}, 'Software engineer in London. I write trading strategies in C++ and Python at Gambit Research, after leading its data team. Before that, IBM and BAE Systems.'),
    h('div', { class: 'btns' }, h('a', { class: 'b pri', href: 'mailto:' + C.email }, 'Email me'), h('a', { class: 'b', href: '#', onclick: e => { e.preventDefault(); print() } }, 'Download CV'), h('a', { class: 'b', href: C.links[0].url }, 'LinkedIn'), h('a', { class: 'b', href: C.links[1].url }, 'GitHub'))),
  h('section', { class: 't now hov' }, h('p', { class: 'lbl' }, h('i'), 'Now'), h('h2', {}, 'Strategy development at Gambit Research'), h('p', {}, 'Coding the trading strategies.'), h('div', { class: 'langs' }, h('span', {}, 'C++'), h('span', {}, 'Python'))),
  h('section', { class: 't clock hov' }, face, h('p', { class: 'lbl' }, 'London'), time),
  h('section', { class: 't stack hov' }, h('p', { class: 'lbl' }, 'Stack'), h('div', { class: 'chips' }, ['C++', 'Python', 'Spark', 'Kafka', 'React', 'TypeScript', 'AWS', 'SQL'].map((s, i) => h('span', { class: i < 2 ? 'k' : '' }, s)))),
  h('section', { class: 't career' }, h('p', { class: 'lbl' }, 'Career'), h('div', { class: 'tl' }, tl.map(r => h('div', { class: 'row' }, h('div', {}, h('b', {}, r.n), h('small', {}, `${r.a} to ${r.b > 2026 ? 'now' : r.b}`)), h('div', { class: 'bar' }, h('i', { style: `--a:${pct(r.a)};--w:calc(${pct(r.b)} - ${pct(r.a)});--c:${r.c}` }, h('span', {}, r.b - r.a >= 3 ? r.s : ''))))), h('div', { class: 'axis' }, [2010, 2014, 2018, 2022, 2026].map(y => h('span', {}, y))))),
  h('section', { class: 't gambit hov' }, h('p', { class: 'lbl' }, 'Gambit Research, 2019 to now'), h('h2', {}, 'Three teams, one company'), h('ol', { class: 'steps' }, C.jobs[0].roles.map((r, i) => h('li', { class: i === 0 ? 'cur' : '' }, h('b', {}, r.title), h('span', {}, i === 0 ? 'C++ and Python, now' : i === 1 ? 'Internal software for trading and research' : 'Led the team, ETL, HDFS, analyst tools'))))),
  ...C.projects.map(p => h('a', { class: 't proj', href: p.url, target: '_blank' }, h('div', { class: 'img' }, h('img', { src: p.img, alt: `${p.name} screenshot`, loading: 'lazy' })), h('div', { class: 'cap' }, h('div', {}, h('b', {}, p.name), h('span', {}, p.text)), h('span', { class: 'go' }, '↗')))),
  h('section', { class: 't edu hov' }, h('p', { class: 'lbl' }, 'Education'), h('h3', {}, 'MSc Mathematics, first class'), h('p', {}, 'University of Leicester. Four module prizes.')),
  h('section', { class: 't bike hov' }, h('p', { class: 'lbl' }, 'Where it started'), h('h3', {}, 'Safety-critical C++ and Ada for the Typhoon and F-35'), h('p', { style: 'color:var(--grey);margin-top:4px' }, 'BAE Systems, 2014')),
  h('section', { class: 't mail hov' }, h('p', { class: 'lbl' }, 'Email'), h('a', { href: 'mailto:' + C.email }, h('b', {}, C.email)), h('button', { class: 'copy', onclick: e => { navigator.clipboard?.writeText(C.email); e.target.textContent = 'Copied' } }, 'Copy')),
  h('footer', { class: 't socials' }, h('span', { class: 'lbl' }, '© 2026 Andy Seymour'), h('div', {}, C.links.map(l => h('a', { href: l.url }, l.label)))))
const tick = () => { const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/London' })); time.textContent = d.toTimeString().slice(0, 5); document.getElementById('hh').style.transform = `rotate(${(d.getHours() % 12 + d.getMinutes() / 60) * 30 + 180}deg)`; document.getElementById('mm').style.transform = `rotate(${d.getMinutes() * 6 + 180}deg)` }
tick(); setInterval(tick, 5000)
const tiles = [...document.querySelectorAll('.t')]
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15 })
tiles.forEach((t, i) => { t.style.transitionDelay = Math.min(i, 8) * 50 + 'ms'; io.observe(t) })
</script>
</body>
</html>
