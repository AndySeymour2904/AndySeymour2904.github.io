<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial · Andy Seymour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f4ef; --fg:#171614; --fg2:#45433e; --mute:#8b877e; --line:#dcd8ce; --acc:#9b2c1b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }
  .serif { font-family: Newsreader, Georgia, serif; }
  .top { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; border-bottom: 1px solid var(--fg); font-size: 13px; letter-spacing: .02em; }
  .top b { font: 600 15px Newsreader, serif; letter-spacing: .14em; text-transform: uppercase; }
  .top nav { display: flex; gap: 22px; } .top nav a { text-decoration: none; color: var(--fg2); } .top nav a:hover { color: var(--acc); }
  .hero { padding: clamp(64px, 11vw, 150px) 0 clamp(48px, 7vw, 90px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); font-weight: 600; }
  .hero h1 { font: 300 clamp(40px, 6.6vw, 96px)/1.02 Newsreader, serif; letter-spacing: -.025em; max-width: 14em; text-wrap: balance; }
  .hero h1 em { font-style: italic; color: var(--acc); }
  .byline { display: flex; gap: 10px 28px; flex-wrap: wrap; color: var(--fg2); font-size: 15px; border-top: 1px solid var(--line); padding-top: 18px; }
  .byline span::before { content: "— "; color: var(--mute); }
  section { padding: clamp(48px, 7vw, 90px) 0; border-top: 1px solid var(--fg); }
  .sh { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px 48px; }
  @media (min-width: 860px) { .sh { grid-template-columns: 260px minmax(0, 1fr); } }
  h2 { font: italic 400 30px/1.1 Newsreader, serif; }
  .lead { font: 400 clamp(20px, 2.1vw, 26px)/1.45 Newsreader, serif; color: var(--fg); max-width: 34em; }
  .job { padding: 28px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px 48px; }
  .job:first-child { padding-top: 0; }
  @media (min-width: 860px) { .job { grid-template-columns: 260px minmax(0, 1fr); } }
  .job h3 { font: 500 28px/1.1 Newsreader, serif; letter-spacing: -.01em; }
  .job .when { font-size: 13px; color: var(--mute); margin-top: 6px; }
  .role + .role { margin-top: 20px; }
  .role h4 { font: 600 16px Inter, sans-serif; }
  .role .tags { font-size: 12px; color: var(--mute); letter-spacing: .03em; margin: 1px 0 4px; }
  .role p { color: var(--fg2); max-width: 60ch; }
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px 40px; }
  .skills dt { font: italic 18px Newsreader, serif; color: var(--acc); }
  .skills dd { color: var(--fg2); }
  .proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px; }
  .proj a { text-decoration: none; display: block; }
  .proj img { width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top left; border: 1px solid var(--line); display: block; margin-bottom: 12px; filter: sepia(.25) saturate(.7); transition: filter .4s; }
  .proj a:hover img { filter: none; }
  .proj b { font: 500 22px Newsreader, serif; display: block; }
  .proj span { color: var(--fg2); font-size: 15px; }
  .contact { text-align: center; padding: clamp(72px, 10vw, 140px) 0; border-top: 1px solid var(--fg); }
  .contact a.mail { font: 300 clamp(30px, 6vw, 80px)/1 Newsreader, serif; text-decoration: none; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .contact a.mail:hover { color: var(--acc); font-style: italic; }
  .contact ul { list-style: none; display: flex; justify-content: center; gap: 28px; margin-top: 26px; color: var(--fg2); }
  footer { font-size: 12px; color: var(--mute); padding: 20px 0 32px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .fade { opacity: 0; transform: translateY(10px); transition: opacity .9s, transform .9s; } .fade.in { opacity: 1; transform: none; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="content.js"></script>
<script>
const C = CV, app = document.getElementById('app')
app.append(
  h('header', { class: 'top' }, h('b', {}, C.name), h('nav', {}, h('a', { href: '#experience' }, 'Experience'), h('a', { href: '#projects' }, 'Projects'), h('a', { href: '#contact' }, 'Contact'))),
  h('div', { class: 'hero' },
    h('p', { class: 'kicker' }, `${C.title} · ${C.location}`),
    h('h1', { html: 'I write <em>trading strategies</em> in C++ and Python, after a decade building data platforms and products.' }),
    h('p', { class: 'byline' }, h('span', {}, 'Gambit Research'), h('span', {}, 'IBM'), h('span', {}, 'BAE Systems'), h('span', {}, 'MSc Mathematics'))),
  h('section', { class: 'sh fade' }, h('h2', {}, 'In brief'), h('p', { class: 'lead' }, C.summary)),
  h('section', { id: 'experience', class: 'sh' }, h('h2', {}, 'Experience'), h('div', {}, C.jobs.map(j => h('article', { class: 'job fade' },
    h('div', {}, h('h3', {}, j.company), h('p', { class: 'when' }, `${years(j)} · ${j.place}`)),
    h('div', {}, j.roles.map(r => h('div', { class: 'role' }, h('h4', {}, r.title), r.tags.length ? h('p', { class: 'tags' }, r.tags.join(' · ')) : null, h('p', {}, r.text)))))))),
  h('section', { class: 'sh fade' }, h('h2', {}, 'Skills'), h('dl', { class: 'skills' }, C.skills.map(s => h('div', {}, h('dt', {}, s.group), h('dd', {}, s.items))))),
  h('section', { id: 'projects', class: 'sh' }, h('h2', {}, 'Side projects'), h('div', { class: 'proj' }, C.projects.map(p => h('a', { class: 'fade', href: p.url, target: '_blank' }, h('img', { src: p.img, alt: '', loading: 'lazy' }), h('b', {}, p.name), h('span', {}, p.text))))),
  h('section', { class: 'sh fade' }, h('h2', {}, 'Education'), h('p', { class: 'lead' }, `${C.education.degree}, ${C.education.school}. ${C.education.note}.`)),
  h('div', { class: 'contact', id: 'contact' }, h('a', { class: 'mail', href: 'mailto:' + C.email }, C.email), h('ul', {}, C.links.map(l => h('li', {}, h('a', { href: l.url }, l.label))))),
  h('footer', {}, h('span', {}, `© 2026 ${C.name}`), h('span', {}, C.location)))
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), { threshold: .1 })
document.querySelectorAll('.fade').forEach(n => io.observe(n))
</script>
</body>
</html>
