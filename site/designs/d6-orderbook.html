<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order book · Andy Seymour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#08090b; --bg2:#0f1114; --fg:#e8e8e6; --fg2:#a9aaa6; --mute:#6c6e6b; --line:#1c1f23; --bid:#38c98b; --ask:#ef5f5f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; font-size: 14px; color: var(--fg2); }
  .nav b { color: var(--fg); font-weight: 600; } .nav nav { display: flex; gap: 24px; } .nav a:hover { color: var(--fg); }
  .hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(24px, 5vw, 72px); align-items: center; min-height: calc(100svh - 70px); padding-bottom: 40px; }
  .hero h1 { font-size: clamp(44px, 6.4vw, 92px); font-weight: 600; letter-spacing: -.045em; line-height: .95; }
  .hero h1 span { color: var(--mute); font-weight: 300; }
  .hero p.lead { margin-top: 24px; font-size: clamp(17px, 1.5vw, 20px); color: var(--fg2); max-width: 30em; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 28px; }
  .chips a { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 14px; background: var(--bg2); transition: border-color .2s; }
  .chips a:hover { border-color: var(--fg2); } .chips a.pri { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .book { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 13px; box-shadow: 0 40px 80px -40px #000; }
  .book-h { display: flex; justify-content: space-between; color: var(--mute); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 0 6px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .lvl { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 3px 6px; font-variant-numeric: tabular-nums; }
  .lvl i { position: absolute; top: 1px; bottom: 1px; right: 0; border-radius: 2px; transition: width .35s; }
  .lvl.a i { background: #ef5f5f1c; } .lvl.b i { background: #38c98b1c; }
  .lvl span { position: relative; text-align: right; } .lvl span:first-child { text-align: left; }
  .lvl.a span:first-child { color: var(--ask); } .lvl.b span:first-child { color: var(--bid); }
  .lvl.flash span:nth-child(2) { color: var(--fg); }
  .mid { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 6px; margin: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .mid b { font-size: 20px; font-weight: 500; } .mid.up b { color: var(--bid); } .mid.dn b { color: var(--ask); }
  .book-f { color: var(--mute); font-size: 11px; padding: 8px 6px 0; }
  section { padding: clamp(64px, 9vw, 120px) 0 0; }
  .sh { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 8px; }
  .sh h2 { font-size: 14px; font-weight: 500; color: var(--fg2); } .sh span { font-size: 12px; color: var(--mute); }
  .job { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 8px 40px; padding: 28px 0; border-bottom: 1px solid var(--line); }
  .job h3 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; } .job .when { font-size: 12px; color: var(--mute); }
  .role { padding-left: 18px; border-left: 1px solid var(--line); padding-bottom: 18px; position: relative; }
  .role:last-child { padding-bottom: 0; }
  .role::before { content: ""; position: absolute; left: -4px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); border: 1px solid var(--mute); }
  .role.cur::before { background: var(--bid); border-color: var(--bid); }
  .role h4 { font-size: 17px; font-weight: 500; } .role .t { font-size: 12px; color: var(--mute); } .role p { color: var(--fg2); max-width: 62ch; }
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 20px; }
  .skills div { background: var(--bg); padding: 18px; } .skills b { display: block; font-size: 12px; color: var(--mute); font-weight: 400; margin-bottom: 4px; }
  .proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
  .proj a { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg2); transition: border-color .2s, transform .3s; }
  .proj a:hover { border-color: #3a3d42; transform: translateY(-3px); }
  .proj img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: top left; display: block; opacity: .85; }
  .proj div { padding: 14px 16px 16px; } .proj b { font-weight: 600; } .proj p { color: var(--fg2); font-size: 14px; }
  .contact { padding: clamp(80px, 12vw, 160px) 0 40px; }
  .contact a.mail { font-size: clamp(30px, 5.6vw, 76px); font-weight: 600; letter-spacing: -.04em; overflow-wrap: anywhere; }
  .contact a.mail:hover { color: var(--bid); }
  .contact ul { list-style: none; display: flex; gap: 24px; margin-top: 20px; color: var(--fg2); }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-top: 24px; } .job { grid-template-columns: 1fr; } .nav nav a:not(:last-child) { display: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="content.js"></script>
<script>
const C = CV, app = document.getElementById('app')
const book = h('div', { class: 'book mono', 'aria-hidden': 'true' })
app.append(
  h('header', { class: 'nav' }, h('b', {}, C.name), h('nav', {}, h('a', { href: '#experience' }, 'Experience'), h('a', { href: '#projects' }, 'Projects'), h('a', { href: '#contact' }, 'Contact'))),
  h('div', { class: 'hero' },
    h('div', {}, h('h1', {}, C.name, h('br'), h('span', {}, C.title)), h('p', { class: 'lead' }, C.short),
      h('div', { class: 'chips' }, h('a', { class: 'pri', href: 'mailto:' + C.email }, 'Email me'), C.links.slice(0, 2).map(l => h('a', { href: l.url }, l.label)))),
    book),
  h('section', { id: 'experience' }, h('div', { class: 'sh' }, h('h2', {}, 'Experience'), h('span', { class: 'mono' }, '2014 – now')),
    C.jobs.map((j, ji) => h('article', { class: 'job' }, h('div', {}, h('h3', {}, j.company), h('p', { class: 'when mono' }, `${years(j)} · ${j.place}`)),
      h('div', {}, j.roles.map((r, ri) => h('div', { class: 'role' + (ji + ri === 0 ? ' cur' : '') }, h('h4', {}, r.title), r.tags.length ? h('p', { class: 't mono' }, r.tags.join(' · ')) : null, h('p', {}, r.text))))))),
  h('section', {}, h('div', { class: 'sh' }, h('h2', {}, 'Skills')), h('div', { class: 'skills' }, C.skills.map(s => h('div', {}, h('b', {}, s.group), s.items)))),
  h('section', { id: 'projects' }, h('div', { class: 'sh' }, h('h2', {}, 'Side projects'), h('span', {}, 'Outside work')),
    h('div', { class: 'proj' }, C.projects.map(p => h('a', { href: p.url, target: '_blank' }, h('img', { src: p.img, alt: '', loading: 'lazy' }), h('div', {}, h('b', {}, p.name + ' ↗'), h('p', {}, p.text)))))),
  h('section', {}, h('div', { class: 'sh' }, h('h2', {}, 'Education')), h('p', { style: 'padding:16px 0' }, `${C.education.degree} · ${C.education.school} · ${C.education.note}`)),
  h('div', { class: 'contact', id: 'contact' }, h('a', { class: 'mail', href: 'mailto:' + C.email }, C.email), h('ul', {}, C.links.map(l => h('li', {}, h('a', { href: l.url }, l.label))))))

// --- simulated order book (decorative) ---
const N = 8, tick = 0.01
let mid = 2.48, last = mid
const asks = [], bids = []
const head = h('div', { class: 'book-h' }, h('span', {}, 'Price'), h('span', {}, 'Size'), h('span', {}, 'Total'))
const midEl = h('div', { class: 'mid' }, h('b', {}, ''), h('span', { style: 'color:var(--mute);font-size:11px' }, 'MID'))
const mk = cls => { const i = h('i'), a = h('span'), b = h('span'), c = h('span'); return { el: h('div', { class: 'lvl ' + cls }, i, a, b, c), i, a, b, c, size: 0 } }
for (let k = 0; k < N; k++) { asks.push(mk('a')); bids.push(mk('b')) }
book.append(head, ...asks.map(x => x.el).reverse(), midEl, ...bids.map(x => x.el), h('div', { class: 'book-f' }, 'Simulated · decoration only'))
asks.concat(bids).forEach(l => l.size = 50 + Math.random() * 900)
const render = () => {
  const draw = (side, sign) => {
    let tot = 0
    side.forEach((l, k) => { tot += l.size; l.tot = tot; l.a.textContent = (mid + sign * (k + 1) * tick).toFixed(2); l.b.textContent = Math.round(l.size); l.c.textContent = Math.round(tot) })
    side.forEach(l => l.i.style.width = (l.tot / tot * 100) + '%')
  }
  draw(asks, 1); draw(bids, -1)
  midEl.firstChild.textContent = mid.toFixed(3)
  midEl.className = 'mid ' + (mid > last ? 'up' : mid < last ? 'dn' : '')
}
render()
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => {
  last = mid
  const l = (Math.random() < .5 ? asks : bids)[Math.floor(Math.random() * N)]
  l.size = Math.max(10, l.size + (Math.random() - .45) * 300)
  l.el.classList.add('flash'); setTimeout(() => l.el.classList.remove('flash'), 300)
  if (Math.random() < .18) mid = +(mid + (Math.random() < .5 ? -tick : tick)).toFixed(2)
  render()
}, 220)
</script>
</body>
</html>
