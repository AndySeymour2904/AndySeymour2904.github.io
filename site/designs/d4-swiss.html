<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss · Andy Seymour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --fg:#0a0a0a; --mute:#7a7a7a; --line:#e4e4e4; --red:#e10600; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 500 15px/1.45 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .g { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0 clamp(10px, 1.6vw, 20px); padding: 0 clamp(16px, 2.5vw, 32px); }
  .bar { padding-top: 16px; padding-bottom: 16px; font-size: 13px; }
  .bar > * { grid-column: span 3; } .bar nav { grid-column: 10 / 13; display: flex; gap: 16px; justify-content: end; }
  .bar nav a:hover { color: var(--red); }
  .hero { padding-top: clamp(40px, 10vh, 120px); padding-bottom: 24px; align-items: end; }
  .sq { grid-column: 1 / 2; width: clamp(28px, 4vw, 56px); aspect-ratio: 1; background: var(--red); align-self: start; margin-top: .6vw; }
  .hero h1 { grid-column: 2 / 13; font-size: clamp(56px, 13vw, 220px); font-weight: 800; letter-spacing: -.065em; line-height: .82; }
  .facts { padding-top: 28px; padding-bottom: clamp(60px, 10vw, 120px); border-bottom: 2px solid var(--fg); }
  .facts > div { grid-column: span 3; padding-top: 10px; border-top: 2px solid var(--fg); }
  .facts dt { font-size: 12px; color: var(--mute); }
  .facts dd { font-size: clamp(16px, 1.5vw, 20px); font-weight: 600; letter-spacing: -.01em; }
  .facts > div:first-child dd { color: var(--red); }
  .row-h { padding-top: 56px; padding-bottom: 14px; }
  .row-h h2 { grid-column: 1 / 4; font-size: 13px; font-weight: 700; }
  .row-h p { grid-column: 4 / 13; font-size: clamp(22px, 2.4vw, 34px); line-height: 1.2; letter-spacing: -.025em; font-weight: 600; max-width: 26em; }
  table { width: 100%; border-collapse: collapse; }
  .tbl { padding-top: 18px; }
  .tbl > div { grid-column: 1 / -1; }
  th { font-size: 12px; color: var(--mute); text-align: left; font-weight: 500; padding: 8px 10px 8px 0; border-bottom: 2px solid var(--fg); }
  td { padding: 14px 10px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { transition: background .15s, color .15s; }
  tbody tr:hover { background: var(--fg); color: #fff; }
  tbody tr:hover td.t { color: #fff; }
  td.y { width: 12%; font-variant-numeric: tabular-nums; } td.c { width: 18%; font-weight: 700; } td.r { width: 26%; font-weight: 600; } td.t { color: #444; }
  td.s { width: 16%; font-size: 12px; color: var(--mute); }
  .skills > div { grid-column: span 3; padding: 12px 0; border-top: 1px solid var(--line); }
  .skills b { font-size: 12px; color: var(--mute); font-weight: 500; display: block; }
  .projects a { grid-column: span 4; display: block; padding-top: 12px; border-top: 2px solid var(--fg); }
  .projects img { width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top left; display: block; margin: 10px 0; filter: grayscale(1); transition: filter .3s; }
  .projects a:hover img { filter: none; } .projects a:hover b { color: var(--red); }
  .projects b { font-size: 20px; letter-spacing: -.02em; } .projects span { display: block; color: #444; }
  .contact { padding-top: clamp(80px, 12vw, 160px); padding-bottom: 28px; }
  .contact .mail { grid-column: 1 / -1; font-size: clamp(34px, 7.5vw, 120px); font-weight: 800; letter-spacing: -.055em; line-height: .95; overflow-wrap: anywhere; }
  .contact .mail:hover { color: var(--red); }
  .contact ul { grid-column: 1 / -1; list-style: none; display: flex; gap: 24px; margin-top: 24px; padding-top: 12px; border-top: 2px solid var(--fg); }
  @media (max-width: 760px) {
    .bar > *:nth-child(2), .bar > *:nth-child(3) { display: none; } .bar > *:first-child { grid-column: 1 / 7; } .bar nav { grid-column: 7 / 13; }
    .sq { display: none; } .hero h1 { grid-column: 1 / -1; }
    .facts > div, .skills > div { grid-column: span 6; margin-bottom: 14px; }
    .row-h h2, .row-h p { grid-column: 1 / -1; } .row-h h2 { margin-bottom: 8px; }
    .projects a { grid-column: 1 / -1; margin-bottom: 20px; }
    td.s, th.s, td.t, th.t { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="content.js"></script>
<script>
const C = CV, app = document.getElementById('app')
const rows = C.jobs.flatMap(j => j.roles.map((r, i) => ({ y: i === 0 ? years(j) : '', c: i === 0 ? j.company : '', ...r })))
app.append(
  h('header', { class: 'g bar' }, h('span', {}, C.name), h('span', {}, C.title), h('span', {}, C.location), h('nav', {}, h('a', { href: '#work' }, 'Work'), h('a', { href: '#contact' }, 'Contact'))),
  h('div', { class: 'g hero' }, h('div', { class: 'sq' }), h('h1', {}, 'Andy', h('br'), 'Seymour')),
  h('dl', { class: 'g facts' },
    h('div', {}, h('dt', {}, 'Now'), h('dd', {}, 'Strategy development, Gambit Research')),
    h('div', {}, h('dt', {}, 'Languages'), h('dd', {}, 'C++, Python')),
    h('div', {}, h('dt', {}, 'Experience'), h('dd', {}, 'Since 2014')),
    h('div', {}, h('dt', {}, 'Before'), h('dd', {}, 'IBM, BAE Systems'))),
  h('div', { class: 'g row-h', id: 'work' }, h('h2', {}, 'Profile'), h('p', {}, C.summary)),
  h('div', { class: 'g row-h' }, h('h2', {}, 'Experience')),
  h('div', { class: 'g tbl' }, h('div', {}, h('table', {},
    h('thead', {}, h('tr', {}, h('th', {}, 'Years'), h('th', {}, 'Company'), h('th', {}, 'Role'), h('th', { class: 't' }, 'Work'), h('th', { class: 's' }, 'Stack'))),
    h('tbody', {}, rows.map(r => h('tr', {}, h('td', { class: 'y' }, r.y), h('td', { class: 'c' }, r.c), h('td', { class: 'r' }, r.title), h('td', { class: 't' }, r.text), h('td', { class: 's' }, r.tags.join(', ')))))))),
  h('div', { class: 'g row-h' }, h('h2', {}, 'Skills')),
  h('div', { class: 'g skills' }, C.skills.map(s => h('div', {}, h('b', {}, s.group), s.items))),
  h('div', { class: 'g row-h' }, h('h2', {}, 'Side projects')),
  h('div', { class: 'g projects' }, C.projects.map(p => h('a', { href: p.url, target: '_blank' }, h('b', {}, p.name + ' ↗'), h('img', { src: p.img, alt: '', loading: 'lazy' }), h('span', {}, p.text)))),
  h('div', { class: 'g row-h' }, h('h2', {}, 'Education'), h('p', {}, `${C.education.degree}, ${C.education.school}`)),
  h('div', { class: 'g contact', id: 'contact' }, h('a', { class: 'mail', href: 'mailto:' + C.email }, C.email), h('ul', {}, C.links.map(l => h('li', {}, h('a', { href: l.url }, l.label + ' ↗'))))))
</script>
</body>
</html>
